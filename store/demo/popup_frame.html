<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* TurboDM teması (uygulamayla aynı renkler); tarayıcının açık/koyu moduna kendiliğinden uyar */
  :root {
    --bg: #f3f5f9; --surface: #ffffff; --surface2: #eef2f7; --border: #d8dfe9; --hover: #e8eef7;
    --text: #17202c; --muted: #5f6d80; --accent: #1f6fe0; --accent-hover: #1a62c8;
    --ok: #1f9d57; --bad: #d93a32; --track: #c3cddb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --surface: #151b24; --surface2: #1b2330; --border: #273142; --hover: #222c3b;
      --text: #e7ecf3; --muted: #8b97a9; --accent: #3b8cf0; --accent-hover: #5199f3;
      --ok: #3ccf7e; --bad: #ff6b63; --track: #334055;
    }
  }
  * { box-sizing: border-box; }
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 330px; margin: 0; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); }
  header img { width: 26px; height: 26px; }
  header b { font-size: 16px; flex: 1; }
  .pill { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted);
    white-space: nowrap; }
  .pill.ok { color: var(--ok); }
  .pill.bad { color: var(--bad); }
  main { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  /* açma/kapama anahtarları */
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px;
    cursor: pointer; }
  .switch + .switch { border-top: 1px solid var(--border); }
  .switch input { appearance: none; width: 34px; height: 19px; border-radius: 999px; background: var(--track);
    position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { left: 17px; }
  button { font: inherit; border: 0; border-radius: 8px; cursor: pointer; }
  #page { width: 100%; padding: 10px; background: var(--accent); color: #fff; font-weight: 600; }
  #page:hover { background: var(--accent-hover); }
  #page:disabled { opacity: .55; cursor: default; }
  /* sayfanın yüklediği akışlar: yalnızca bulunduysa görünür */
  #quals h4, #media h4 { margin: 0; padding: 9px 12px; font-size: 12px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border); }
  #media h4 #count { color: var(--accent); }
  .m { display: flex; gap: 8px; align-items: center; padding: 7px 12px; }
  .m + .m { border-top: 1px solid var(--border); }
  .m span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m button { background: var(--surface2); color: var(--accent); padding: 5px 10px; font-weight: 600; }
  .m button:hover { background: var(--hover); }
  #list, #qlist { max-height: 220px; overflow: auto; }
  /* video kaliteleri: satırın tamamı tıklanır (sayfadaki menüyle aynı) */
  .q { padding: 8px 12px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q + .q { border-top: 1px solid var(--border); }
  .q:hover { background: var(--hover); }
  .note { padding: 9px 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <img src="../../browser_extension/icons/icon32.png" alt="">
    <b>TurboDM</b>
    <span id="st" class="pill" data-i18n="popupChecking"></span>
  </header>
  <main>
    <div class="card">
      <label class="switch"><span data-i18n="popupCatch"></span><input type="checkbox" id="en"></label>
      <label class="switch"><span data-i18n="popupGrabber"></span><input type="checkbox" id="gr"></label>
    </div>
    <button id="page" data-i18n="popupPage" style="display:none"></button>
    <div id="quals" class="card" style="display:none">
      <h4 data-i18n="popupQualities"></h4>
      <div id="qlist"></div>
    </div>
    <div id="media" class="card" style="display:none">
      <h4><span data-i18n="popupMedia"></span> · <span id="count"></span></h4>
      <div id="list"></div>
    </div>
  </main>
  <script>
const MSGS = {
  "extName": {
    "message": "TurboDM Entegrasyonu"
  },
  "extDescription": {
    "message": "Tarayıcıdaki indirmeleri ve sayfalardaki videoları TurboDM indirme yöneticisine gönderir."
  },
  "ctxDownload": {
    "message": "TurboDM ile indir"
  },
  "labelHls": {
    "message": "Video akışı (HLS)"
  },
  "labelDash": {
    "message": "Video akışı (DASH)"
  },
  "labelAudio": {
    "message": "Ses"
  },
  "labelVideo": {
    "message": "Video"
  },
  "labelPagePlayer": {
    "message": "Video · sayfadaki oynatıcı"
  },
  "appDown": {
    "message": "TurboDM çalışmıyor"
  },
  "appDownLong": {
    "message": "TurboDM çalışmıyor. Programı açıp tekrar deneyin."
  },
  "popupCatch": {
    "message": "İndirmeleri yakala"
  },
  "popupGrabber": {
    "message": "Video yakalayıcı"
  },
  "popupChecking": {
    "message": "Bağlantı denetleniyor…"
  },
  "popupPage": {
    "message": "⬇ Bu sayfadaki videoyu TurboDM'de aç"
  },
  "popupMedia": {
    "message": "Bu sayfadaki medyalar"
  },
  "popupRunning": {
    "message": "✔ TurboDM çalışıyor"
  },
  "popupClosed": {
    "message": "✖ TurboDM kapalı"
  },
  "pickQuality": {
    "message": "✔ TurboDM'de kalite seçin"
  },
  "download": {
    "message": "İndir"
  },
  "btnDownload": {
    "message": "⬇ Bu videoyu indir"
  },
  "sent": {
    "message": "✔ TurboDM'e gönderildi"
  },
  "pickFolder": {
    "message": "✔ TurboDM'de kayıt yerini seçin"
  },
  "loadingQualities": {
    "message": "Kaliteler alınıyor…"
  },
  "noVideo": {
    "message": "Henüz video bulunamadı. Videoyu oynatmayı deneyin."
  },
  "moreOptions": {
    "message": "Diğer seçenekler (TurboDM'de aç)…"
  },
  "opened": {
    "message": "✔ TurboDM'de açıldı"
  },
  "popupQualities": {
    "message": "Video kaliteleri"
  }
}
;
window.chrome = {
  i18n: { getMessage(k) { return k === "@@bidi_dir" ? "ltr" : (MSGS[k] || {}).message || ""; } },
  storage: { local: { get(d, cb) { cb({ enabled: true, grabber: true }); }, set() {} } },
  tabs: { query(q, cb) { cb([{ id: 1, url: "https://ornekvideo.test/izle/123", title: "Doğa Belgeseli" }]); },
          sendMessage(id, m, cb) { cb({ video: true }); } },
  runtime: { lastError: null, sendMessage(m, cb) { setTimeout(() => cb(m.type === "tdm-formats"
      ? { title: "Doğa Belgeseli", choices: [{ label: "2160p (4K) · mp4 · 1,8 GB" }, { label: "1080p · mp4 · 512 MB" },
                                             { label: "720p · mp4 · 260 MB" }, { label: "Yalnızca ses · m4a · 18 MB" }] }
      : [{ url: "https://cdn.ornekvideo.test/master.m3u8", label: "Video akışı (HLS) · 1080p" }]), 20); } },
};
window.fetch = () => Promise.resolve({ json: () => Promise.resolve({ app: "TurboDM" }) });
</script>
<script src="../../browser_extension/popup.js"></script>
</body>
</html>
