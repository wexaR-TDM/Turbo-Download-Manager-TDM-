<!doctype html>
<html>

<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; }
  h3 { margin: 0 0 10px; color: #1e6fd9; }
  label { display: block; margin: 4px 0; }
  #st { margin: 8px 0; font-size: 12px; }

  .m span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #1e6fd9; color: #fff; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
